name: Cipet
options:
  bundleIdPrefix: com.gamejam
  deploymentTarget: { iOS: "17.0" }
  createIntermediateGroups: true
targets:
  Cipet:
    type: application
    platform: iOS
    sources: [Sources, Resources]   # fonts ship with the bundle, names are registered in Cipet-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gamejam.cipet
        DEVELOPMENT_TEAM: JLQK39AS23
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Cipet-Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        # has to be "AppIcon". leave it blank and the icon never makes it into the bundle
        # and app store connect rejects the build with 90022 + 90713.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "c!pet"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.games"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  # plays the start of a game with real touches, since the simulator tools cant tap here
  CipetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Cipet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gamejam.cipet.uitests
        DEVELOPMENT_TEAM: JLQK39AS23
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Cipet
        SWIFT_VERSION: "5.0"

schemes:
  Cipet:
    build:
      targets:
        Cipet: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [CipetUITests]
    archive:
      config: Release
