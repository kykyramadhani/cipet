name: Cipet
options:
  bundleIdPrefix: com.gamejam
  deploymentTarget: { iOS: "17.0" }
  createIntermediateGroups: true
targets:
  Cipet:
    type: application
    platform: iOS
    sources: [Sources, Resources]   # Resources/Fonts ships with the bundle; the font names are registered in Cipet-Info.plist (UIAppFonts)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gamejam.cipet
        DEVELOPMENT_TEAM: JLQK39AS23
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Cipet-Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        # MUST be "AppIcon". Leave it blank and the icon never reaches the bundle, and
        # App Store Connect rejects the build with errors 90022 + 90713.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "c!pet"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.games"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
